<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f2e3c8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="18岁啦">
<meta name="description" content="一封写给十八岁的手写信，轻轻拆开信封看看。">
<title>18岁啦 · 生日信</title>
<style>
  /* ============================================================
     温暖文艺 · 生日信（自包含单文件，无外部依赖）
     结构：背景 + 落叶 → 信封（外壳） → 点开：盖翻开、外壳淡出下沉、
           信纸升到顶部展开（标题 + 照片，可滚动），点照片看大图
     ============================================================ */

  :root {
    --paper: #fffdf6;        /* 信纸本体 */
    --deep:  #7a4a21;        /* 深棕文字 */
    --ink:   #6b4423;        /* 标题深棕 */
    --bg1:   #f6ead6;
    --bg2:   #ecd9b8;
    --bg3:   #e0c69d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", system-ui, -apple-system, sans-serif;
    color: var(--deep);
    background:
      radial-gradient(120% 90% at 50% 0%, #fff8ec 0%, rgba(255,248,236,0) 55%),
      linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== 落叶 ===== */
  .leaves {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
  }
  .leaves span {
    position: absolute;
    top: 0;
    display: block;
    line-height: 1;
    opacity: 0;
    animation: fall linear infinite;
    will-change: transform, opacity;
  }
  @keyframes fall {
    0%   { transform: translate3d(0, -10vh, 0) rotate(0deg); opacity: 0; }
    8%   { opacity: var(--lo, .6); }
    90%  { opacity: var(--lo, .6); }
    100% { transform: translate3d(var(--lx, 40px), 112vh, 0) rotate(var(--lr, 200deg)); opacity: 0; }
  }

  /* ===== 舞台 ===== */
  .stage {
    --ew: min(86vw, 336px);
    --eh: calc(var(--ew) * 0.68);
    position: relative;
    min-height: 100vh;
    min-height: 100dvh;
    z-index: 1;
  }

  /* ===== 信纸卡片（初始隐藏在信封下面，点开后升到顶部） ===== */
  .card {
    position: relative;
    width: min(88vw, 340px);
    margin: 28px auto 80px;
    background: var(--paper);
    border-radius: 12px;
    padding: 18px 16px 14px;
    text-align: center;
    box-shadow: 0 16px 44px -12px rgba(90, 60, 25, .4);
    opacity: 0;
    transform: translateY(96px);
    transition: opacity .7s ease, transform .85s cubic-bezier(.22, 1, .36, 1);
    z-index: 2;
    pointer-events: none;
  }
  .stage.revealed .card {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .card .title {
    font-family: "STKaiti", "KaiTi", "FangSong", "STFangsong", "Songti SC", serif;
    font-size: clamp(30px, 8.5vw, 40px);
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--ink);
    margin-bottom: 14px;
  }
  .card .title::before,
  .card .title::after {
    content: "🍂";
    font-size: .55em;
    vertical-align: .18em;
    margin: 0 8px;
    opacity: .75;
  }

  .card .photo {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 6px;
    border: 1px solid #eeddc2;
    background: #f6ecd9;
  }

  .card .foot {
    margin-top: 14px;
    font-size: 13px;
    letter-spacing: 1px;
    color: #b08a5e;
    font-family: "STKaiti", "KaiTi", "Songti SC", serif;
  }

  /* ===== 信封（外壳，绝对定位居中） ===== */
  .envelope {
    position: absolute;
    left: 50%;
    top: 50%;
    width: var(--ew);
    height: var(--eh);
    transform: translate(-50%, -50%);
    perspective: 1100px;
    cursor: pointer;
    outline: none;
    z-index: 10;
    -webkit-user-select: none;
    user-select: none;
    animation: bob 3.4s ease-in-out infinite;
    transition: opacity .5s ease, transform .65s ease;
  }
  .envelope.opened { animation: none; cursor: default; }

  .stage.revealed .envelope {
    opacity: 0;
    transform: translate(-50%, calc(-50% + 90px)) scale(.82);
    pointer-events: none;
  }

  @keyframes bob {
    0%, 100% { transform: translate(-50%, -50%); }
    50%      { transform: translate(-50%, calc(-50% - 8px)); }
  }

  .env-back {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #f0ddbd 0%, #e6cba0 100%);
    border-radius: 10px;
    box-shadow: 0 18px 40px -12px rgba(120, 78, 32, .45);
    z-index: 1;
  }

  .env-front {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #fbf2e2 0%, #f3e2c6 100%);
    clip-path: polygon(0 0, 50% 46%, 100% 0, 100% 100%, 0 100%);
    border-radius: 10px;
    z-index: 3;
    pointer-events: none;
  }

  .env-flap {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, #ecc99b 0%, #d9ac74 100%);
    clip-path: polygon(0 0, 100% 0, 50% 46%);
    border-radius: 10px 10px 0 0;
    transform-origin: top center;
    transform: rotateX(0deg);
    transition: transform .5s cubic-bezier(.34, 1.3, .5, 1);
    z-index: 4;
    pointer-events: none;
  }
  .envelope.opened .env-flap {
    transform: rotateX(180deg);
    z-index: 1;
  }

  .seal {
    position: absolute;
    left: 50%;
    top: 46%;
    transform: translate(-50%, -50%);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #c96a54 0%, #a63f2e 55%, #7e2c1e 100%);
    box-shadow: 0 2px 6px rgba(120, 40, 24, .5), inset 0 1px 2px rgba(255,255,255,.35);
    z-index: 5;
    pointer-events: none;
    transition: opacity .22s ease;
  }
  .envelope.opened .seal { opacity: 0; }

  .envelope .to {
    position: absolute;
    left: 50%;
    bottom: 12%;
    transform: translateX(-50%);
    font-family: "STKaiti", "KaiTi", "Songti SC", serif;
    font-size: 13px;
    letter-spacing: 2px;
    color: #b08a5e;
    z-index: 3;
    pointer-events: none;
  }

  /* ===== 提示语（信封下方） ===== */
  .hint {
    position: absolute;
    left: 50%;
    top: calc(50% + var(--eh) / 2 + 26px);
    transform: translateX(-50%);
    font-size: 14px;
    letter-spacing: 1px;
    color: #a9804f;
    white-space: nowrap;
    animation: pulse 2.2s ease-in-out infinite;
    transition: opacity .5s ease;
  }
  .hint.gone { opacity: 0; }
  @keyframes pulse {
    0%, 100% { opacity: .55; }
    50%      { opacity: 1; }
  }

  /* ===== 灯箱（看大图） ===== */
  .lightbox {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(58, 36, 18, .88);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
  }
  .lightbox.show { opacity: 1; pointer-events: auto; }
  .lightbox img {
    max-width: 94vw;
    max-height: 88vh;
    width: auto;
    height: auto;
    border-radius: 6px;
    background: #fff;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    transform: scale(.96);
    transition: transform .3s ease;
  }
  .lightbox.show img { transform: scale(1); }
  .lb-close {
    position: absolute;
    top: calc(16px + env(safe-area-inset-top));
    right: 18px;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,.16);
    color: #fff;
    font-size: 20px;
    line-height: 42px;
    text-align: center;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
</style>

<script>
  (function () {
    var stage    = document.getElementById('stage');
    var envelope = document.getElementById('envelope');
    var card     = document.getElementById('card');
    var hint     = document.getElementById('hint');
    var lightbox = document.getElementById('lightbox');
    var lbClose  = document.getElementById('lbClose');
    var done = false;

    function open() {
      if (done) return;
      done = true;
      envelope.classList.add('opened');   // 1. 信封盖翻开、火漆淡化
      hint.classList.add('gone');

      setTimeout(function () {
        stage.classList.add('revealed');  // 2. 信封淡出下沉，信纸升到顶部
        try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) {}
      }, 500);
    }

    envelope.addEventListener('click', open);
    envelope.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); }
    });

    // 点击信纸上的照片 → 灯箱看大图
    card.addEventListener('click', function (e) {
      if (!done) return;
      if (e.target && e.target.tagName === 'IMG') {
        lightbox.classList.add('show');
      }
    });
    lightbox.addEventListener('click', function () { lightbox.classList.remove('show'); });
    lbClose.addEventListener('click', function (e) {
      e.stopPropagation();
      lightbox.classList.remove('show');
    });
  })();
</script>
